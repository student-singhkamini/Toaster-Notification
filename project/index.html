<body class="bg-gradient-to-br from-blue-100 via-purple-100 to-pink-100 min-h-screen">

  <!-- FORM -->

 
       <form autocomplete="off"
        class="bg-white/90 backdrop-blur rounded-2xl shadow-xl p-8 mb-12 mt-5 w-full max-w-lg mx-auto">

        <h2 class="text-3xl font-bold mb-6 text-center text-blue-700 tracking-tight">
            Add User
        </h2>

        <div class="mb-5">
            <label class="block text-gray-700 font-medium mb-2" for="name">
                Name
            </label>

            <input
                class="w-full px-4 py-2 border border-blue-200 rounded-lg focus:outline-none"
                type="text"
                id="name"
                name="name"
                required>
        </div>

        <div class="mb-5">
            <label class="block text-gray-700 font-medium mb-2" for="role">
                Role
            </label>

            <input
                class="w-full px-4 py-2 border border-blue-200 rounded-lg focus:outline-none"
                type="text"
                id="role"
                name="role"
                required>
        </div>
        <div class="mb-5">
            <label class="block text-gray-700 font-medium mb-2" for="bio">
                Bio
            </label>

            <textarea class="w-full px-4 py-2 border border-blue-200 rounded-lg focus:outline-none" name="bio" id="bio"></textarea>
        </div>

        <div class="mb-7">
            <label class="block text-gray-700 font-medium mb-2" for="photo">
                Photo URL
            </label>

            <input
                class="w-full px-4 py-2 border border-blue-200 rounded-lg focus:outline-none"
                type="url"
                id="photo"
                name="photo"
                required>
        </div>
        <div>
          <button class="w-full px-4 py-2 border border-blue-200 rounded-lg focus:outline-none bg-blue-700">Submit</button>
        </div>

        

    </form>


    <div class="users grid grid-cols-1 md:grid-cols-3 gap-10 px-6 max-w-6xl mx-auto">

    </div>
